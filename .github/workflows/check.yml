name: Check

# Everything build.yml does up to the point where it would publish, on any branch that is
# not main. There is no way to build an APK in the Cowork sandbox — aapt2 ships x86_64-only
# for Linux — so a change worked on there has never been compiled by anything until it is
# pushed. Without this the only way to find out was to push to main, which installs onto a
# phone within minutes. This is that same check with the release step removed.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Resolving light-common from GitHub Packages, which has no anonymous read. The runner
      # exports GITHUB_ACTOR but not GITHUB_TOKEN, so the token has to be handed in. GPR_* wins
      # if set, for the case where a repo-scoped token is not accepted for another repo's package.
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # assembleRelease rather than a bare compile: lint-adjacent failures such as a missing
      # Application class or a manifest permission that does not exist only surface at
      # manifest merge and resource processing, which a Kotlin compile never reaches.
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
