name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  # light-common is a GitHub Packages artifact, and even a public package needs a token.
  packages: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Restore release signing key and lineage
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ ! ${!secret} =~ [^[:space:]] ]]; then
              echo "::error::Missing required release signing secret: $secret"
              exit 1
            fi
          done

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/brightremote-signing.XXXXXX")
          decode() {
            if ! printf '%s' "${!1}" | base64 --decode > "$2" || [[ ! -s "$2" ]]; then
              echo "::error::$1 must contain non-empty base64"
              exit 1
            fi
          }
          decode RELEASE_KEYSTORE_BASE64 "$signing_dir/release.jks"
          decode SIGNING_LINEAGE_BASE64 "$signing_dir/release.lineage"
          printf 'keystore=%s\nlineage=%s\n' "$signing_dir/release.jks" "$signing_dir/release.lineage" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The 'tools' package (the pre-cmdline-tools SDK) was dropped from the SDK index and
          # `sdkmanager tools` now exits 1, failing the step before any build runs. Install only
          # what the build needs; platforms/build-tools come from the runner image and AGP.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer build and
      # `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # The protocol layer is the whole app, and none of it can be checked by looking at
      # the screen: a wrong byte in OPACK, SRP, ChaCha20-Poly1305, Ed25519 or the plist
      # writer shows up only as an Apple TV that refuses to pair. Every one of those is
      # tested against golden vectors generated from pyatv's own libraries, so these tests
      # gate the build.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify release APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          SIGNING_LINEAGE_FILE: ${{ steps.signing.outputs.lineage }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/LightRemote-v$VERSION.apk" signing-lineage-root-fingerprint.txt signing-fingerprint.txt

      - name: Collect debug APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p debugout
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightRemote-v$V-debug.apk"
          ls -la out debugout

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed to
      # something like res/AB.png inside the zip. Ask the package what its icon is instead
      # of grepping filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightRemote-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightRemote-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      # One asset per release: Obtainium picks whatever it finds, and a debug APK alongside
      # the release one is how it ends up installing the wrong signature.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightRemote v${{ steps.ver.outputs.version }}
          files: out/LightRemote-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
