name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # light-common is a GitHub Packages artifact, and even a public package needs a token.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer build and
      # `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # The protocol layer is the whole app, and none of it can be checked by looking at
      # the screen: a wrong byte in OPACK, SRP, ChaCha20-Poly1305, Ed25519 or the plist
      # writer shows up only as an Apple TV that refuses to pair. Every one of those is
      # tested against golden vectors generated from pyatv's own libraries, so these tests
      # gate the build.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/LightRemote-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/LightRemote-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever changes,
      # Obtainium updates fail with an opaque "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed to
      # something like res/AB.png inside the zip. Ask the package what its icon is instead
      # of grepping filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightRemote-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightRemote-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      # One asset per release: Obtainium picks whatever it finds, and a debug APK alongside
      # the release one is how it ends up installing the wrong signature.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LightRemote v${{ steps.ver.outputs.version }}
          files: out/LightRemote-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true
